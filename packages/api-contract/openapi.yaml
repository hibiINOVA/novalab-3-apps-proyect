# NOVALAB — Contrato de API (stub temporal)
#
# ⚠️ TEMPORAL: este archivo es un SUBCONJUNTO mínimo escrito a mano para permitir
# el desarrollo contract-first de `apps/produccion` (P-01..P-03).
# Fuente de verdad definitiva: el OpenAPI GENERADO por el backend FastAPI
# (doc §3.1, §7). Cuando exista el backend, reemplazar este archivo por su
# `openapi.json`/`openapi.yaml` y regenerar el cliente Dart. No agregar aquí
# lógica de negocio ni endpoints fuera del alcance de la entrega.
openapi: 3.0.3
info:
  title: NOVALAB API
  description: >-
    Contrato compartido por las 3 aplicaciones. Esta es una versión parcial
    (auth, branding, impresoras y cola) usada mientras el backend no existe.
  version: 0.1.0
servers:
  - url: /
    description: Mismo origen (el backend se sirve detrás de Caddy en el puerto privado)

tags:
  - name: auth
  - name: organizations
  - name: public
  - name: printers
  - name: queue
  - name: print-jobs
  - name: orders
  - name: customers
  - name: products

paths:
  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Inicia sesión y devuelve tokens JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Renueva el access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token renovado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Crea una cuenta nueva y devuelve tokens (registro abierto)
      description: >-
        Registro público (decisión de producto v1). Rate limit por IP (BE-19).
        409 si el correo ya existe.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Cuenta creada y sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '409':
          description: Correo ya registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Datos inválidos
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/public/branding:
    get:
      tags: [public]
      operationId: getBranding
      summary: Marca y configuración visible del negocio
      security: []
      responses:
        '200':
          description: Branding del negocio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branding'


  /api/public/track/{token}:
    get:
      tags: [public]
      operationId: getPublicTrack
      summary: Seguimiento público de pedido por token
      description: Estado, línea de tiempo, items con progreso, envío. No expone costos/ganancias.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detalle público del pedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/public/track/{token}/camera:
    get:
      tags: [public]
      operationId: getPublicTrackCamera
      summary: Snapshot de cámara mientras el pedido está imprimiendo (público)
      description: Último snapshot servido por el backend. Solo disponible si aplica.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Imagen snapshot (JPEG)
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '204':
          description: Sin snapshot disponible
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/public/lookup:
    post:
      tags: [public]
      operationId: lookupOrderToken
      summary: Obtener tracking_token por folio y últimos 4 dígitos del teléfono
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicLookupRequest'
      responses:
        '200':
          description: Token encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicLookupResponse'
        '404':
          description: No encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/organizations:
    post:
      tags: [organizations]
      operationId: createOrganization
      summary: Crea una organización nueva (Dueño) y genera su ID único
      description: >-
        Crea una organización asociada al usuario autenticado (debe ser Dueño).
        Devuelve el código único generado (p. ej. ORG-NOVA-8492) para compartir con operadores.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationCreateRequest'
      responses:
        '201':
          description: Organización creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          description: Datos inválidos o nombre ya ocupado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [organizations]
      operationId: updateOrganization
      summary: Actualiza los datos de la organización (Dueño)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationUpdateRequest'
      responses:
        '200':
          description: Organización actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: El usuario no pertenece a ninguna organización
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/organizations/current:
    get:
      tags: [organizations]
      operationId: getCurrentOrganization
      summary: Obtiene el estado actual de la organización y membresía del usuario
      responses:
        '200':
          description: Estado actual de organización y membresía
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOrganizationStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/organizations/members:
    get:
      tags: [organizations]
      operationId: listOrganizationMembers
      summary: Lista los miembros activos de la organización (Dueño)
      responses:
        '200':
          description: Miembros activos (dueño y operadores)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/organizations/logo:
    post:
      tags: [organizations]
      operationId: uploadOrganizationLogo
      summary: Sube el logo de la organización (Dueño)
      description: Imagen png/jpeg/webp de máximo 5 MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Logo guardado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: Imagen demasiado grande
        '415':
          description: Formato no soportado (usa png, jpeg o webp)
    get:
      tags: [organizations]
      operationId: downloadOrganizationLogo
      summary: Descarga el logo de la organización (miembro autenticado)
      responses:
        '200':
          description: Imagen del logo
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: La organización no tiene logo
    delete:
      tags: [organizations]
      operationId: deleteOrganizationLogo
      summary: Elimina el logo de la organización (Dueño)
      responses:
        '200':
          description: Logo eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/organizations/join:
    post:
      tags: [organizations]
      operationId: joinOrganization
      summary: Operador solicita unirse a una organización usando su ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinOrganizationRequest'
      responses:
        '200':
          description: Solicitud enviada o estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOrganizationStatus'
        '400':
          description: Solicitud inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Organización no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/organizations/requests:
    get:
      tags: [organizations]
      operationId: listOrganizationRequests
      summary: Lista de solicitudes pendientes de operadores (Dueño)
      responses:
        '200':
          description: Solicitudes pendientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/organizations/requests/{requestId}/approve:
    post:
      tags: [organizations]
      operationId: approveOrganizationRequest
      summary: Dueño acepta la solicitud de un operador
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Solicitud aceptada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMember'
        '404':
          description: Solicitud no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/organizations/requests/{requestId}/reject:
    post:
      tags: [organizations]
      operationId: rejectOrganizationRequest
      summary: Dueño rechaza la solicitud de un operador
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Solicitud rechazada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMember'
        '404':
          description: Solicitud no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/printers:
    get:
      tags: [printers]
      operationId: listPrinters
      summary: Lista las impresoras con su estado en vivo
      responses:
        '200':
          description: Impresoras
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Printer'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [printers]
      operationId: createPrinter
      summary: Registra una nueva impresora en el taller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrinterCreateRequest'
      responses:
        '201':
          description: Impresora registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Printer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Datos inválidos

  /api/printers/test:
    post:
      tags: [printers]
      operationId: testPrinterConnection
      summary: Prueba la conexión a OctoPrint con URL y API key (BE-01)
      description: >-
        Valida URL + API key contra `/api/version` de OctoPrint antes de
        dar de alta la impresora. No guarda nada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrinterConnectionTestRequest'
      responses:
        '200':
          description: Resultado de la prueba (ok o error alcanzable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrinterConnectionTest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/printers/{printerId}/test:
    post:
      tags: [printers]
      operationId: testPrinterConnectionById
      summary: Prueba la conexión guardada de una impresora (BE-01)
      parameters:
        - $ref: '#/components/parameters/PrinterId'
      responses:
        '200':
          description: Resultado de la prueba
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrinterConnectionTest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Impresora sin URL de OctoPrint configurada

  /api/printers/{printerId}:
    get:
      tags: [printers]
      operationId: getPrinter
      summary: Detalle de una impresora
      parameters:
        - $ref: '#/components/parameters/PrinterId'
      responses:
        '200':
          description: Impresora
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Printer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Impresora no encontrada
    patch:
      tags: [printers]
      operationId: updatePrinter
      summary: Actualiza configuración o estado de la impresora
      parameters:
        - $ref: '#/components/parameters/PrinterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrinterUpdateRequest'
      responses:
        '200':
          description: Impresora actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Printer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Impresora no encontrada
    delete:
      tags: [printers]
      operationId: deletePrinter
      summary: Elimina una impresora del taller
      parameters:
        - $ref: '#/components/parameters/PrinterId'
      responses:
        '204':
          description: Impresora eliminada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Impresora no encontrada

  /api/printers/{printerId}/camera/snapshot:
    get:
      tags: [printers]
      operationId: getPrinterCameraSnapshot
      summary: Última miniatura de cámara de la impresora (servida por el backend)
      description: >-
        Devuelve la última instantánea guardada por el backend (BE-07/08). El
        cliente nunca accede al stream ni a la IP de la impresora. `index`
        selecciona la cámara (0 = principal).
      parameters:
        - name: printerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: index
          in: query
          required: false
          description: Índice de cámara (0 = principal).
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Instantánea en PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: La impresora no tiene cámara o aún no hay snapshot

  /api/queue:
    get:
      tags: [queue]
      operationId: getQueue
      summary: Cola de producción (items sin asignar y por impresora)
      responses:
        '200':
          description: Cola completa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/queue/reorder:
    patch:
      tags: [queue]
      operationId: reorderQueue
      summary: Mueve y reordena items entre impresoras y la cola sin asignar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueReorderRequest'
      responses:
        '200':
          description: Cola actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Conflicto de versión de la cola; recargar

  /api/queue/suggest:
    post:
      tags: [queue]
      operationId: suggestQueueAssignment
      summary: Propone una asignación de la cola (BE-13, BE-14)
      description: >-
        El backend propone a qué impresora va cada item pendiente, con una
        explicación legible. El operador decide aceptar todo, aceptar parcial o
        descartar.
      responses:
        '200':
          description: Propuesta con explicación por item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueSuggestion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Conflicto de versión de la cola; recargar

  /api/queue/accept:
    post:
      tags: [queue]
      operationId: acceptQueueAssignment
      summary: Acepta (total o parcialmente) una propuesta de asignación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueAcceptRequest'
      responses:
        '200':
          description: Cola actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Conflicto de versión de la cola; recargar

  /api/print-jobs:
    post:
      tags: [print-jobs]
      operationId: startPrintJob
      summary: Confirma e inicia la impresión de un item (BE-05)
      description: >-
        Requiere confirmación explícita del operador ("cama libre y filamento
        correcto"). Nunca inicia impresiones de forma automática.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrintJobStartRequest'
      responses:
        '201':
          description: Job iniciado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: La impresora no está disponible

  /api/print-jobs/{jobId}/gcode:
    post:
      tags: [print-jobs]
      operationId: uploadPrintJobGcode
      summary: Sube el archivo G-code asociado a un job (BE-05)
      description: >-
        Guarda el archivo .gcode/.gco/.g del job en el servidor (máx. 50 MB).
        Si la impresora tiene OctoPrint configurado, el backend lo envía e
        inicia físicamente (BE-05/BE-06; solo tras la confirmación explícita
        del operador en el start del job). Si el envío falla responde 502 y
        el job queda en `failed`.
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Job actualizado con el archivo asociado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Job no encontrado
        '413':
          description: Archivo demasiado grande
        '415':
          description: Extensión no soportada (usa .gcode, .gco o .g)
        '502':
          description: >-
            OctoPrint rechazó el envío; el job quedó en `failed`
            (código `octoprint_error`).
    get:
      tags: [print-jobs]
      operationId: downloadPrintJobGcode
      summary: Descarga el archivo G-code asociado a un job
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Contenido del archivo G-code
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Job sin archivo G-code o no encontrado

  /api/print-jobs/{jobId}/complete:
    post:
      tags: [print-jobs]
      operationId: completePrintJob
      summary: Marca un job como terminado
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Job no encontrado

  /api/print-jobs/{jobId}/fail:
    post:
      tags: [print-jobs]
      operationId: failPrintJob
      summary: Marca un job como fallido y registra el motivo
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrintJobFailRequest'
      responses:
        '200':
          description: Job actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Job no encontrado

  /api/print-jobs/{jobId}/reprint:
    post:
      tags: [print-jobs]
      operationId: reprintJob
      summary: Crea un nuevo job para reimprimir un item fallido
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '201':
          description: Nuevo job creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Job no encontrado

  /api/orders:
    get:
      tags: [orders]
      operationId: listOrders
      summary: Lista pedidos con filtros y búsqueda por folio/cliente
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: customer_id
          in: query
          schema:
            type: integer
            format: int64
        - name: due_before
          in: query
          schema:
            type: string
            format: date
        - name: q
          in: query
          description: Búsqueda por folio o nombre de cliente
          schema:
            type: string
      responses:
        '200':
          description: Pedidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [orders]
      operationId: createOrder
      summary: Crea un pedido nuevo (P-09)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '201':
          description: Pedido creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Datos inválidos

  /api/orders/{orderId}:
    get:
      tags: [orders]
      operationId: getOrder
      summary: Detalle de pedido (items, faltantes, historial, envío)
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Pedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Pedido no encontrado

  /api/orders/{orderId}/status:
    patch:
      tags: [orders]
      operationId: updateOrderStatus
      summary: Cambio manual de estado (Empacado, Enviado, Entregado, Cancelado)
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdateRequest'
      responses:
        '200':
          description: Pedido actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Pedido no encontrado

  /api/customers:
    get:
      tags: [customers]
      operationId: listCustomers
      summary: Lista de clientes (para nuevo pedido)
      responses:
        '200':
          description: Clientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [customers]
      operationId: createCustomer
      summary: Registra un nuevo cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreateRequest'
      responses:
        '201':
          description: Cliente creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/customers/{customerId}:
    get:
      tags: [customers]
      operationId: getCustomer
      summary: Detalle de un cliente por su ID
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: Cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Cliente no encontrado

  /api/products:
    get:
      tags: [products]
      operationId: listProducts
      summary: Catálogo de productos (para nuevo pedido)
      responses:
        '200':
          description: Productos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'

# Canal de tiempo real (WebSocket). OpenAPI no describe WebSocket de forma nativa;
# se documenta mediante extensión para los generadores de clientes.
x-websocket:
  path: /ws
  description: >-
    Eventos en tiempo real (estado de impresoras, cola y pedidos). Cada mensaje
    es un objeto StatusEvent serializado como JSON.
  message:
    $ref: '#/components/schemas/StatusEvent'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: No autenticado o token inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Demasiados intentos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: No autorizado para esta acción
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PrinterId:
      name: printerId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    MembershipStatus:
      type: string
      enum: [none, pending, active, rejected]

    Role:
      type: string
      enum: [owner, operator]

    User:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        organization_id:
          type: integer
          format: int64
          nullable: true
        organization_code:
          type: string
          nullable: true
        membership_status:
          $ref: '#/components/schemas/MembershipStatus'

    Organization:
      type: object
      required: [id, code, name, owner_id]
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
          description: ID único de la organización para compartir con operadores (p. ej. ORG-NOVA-8492)
        name:
          type: string
        description:
          type: string
          nullable: true
        vision:
          type: string
          nullable: true
        mission:
          type: string
          nullable: true
        has_logo:
          type: boolean
          default: false
        owner_id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
          nullable: true

    OrganizationCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
        description:
          type: string
          maxLength: 2000
          nullable: true
        vision:
          type: string
          maxLength: 2000
          nullable: true
        mission:
          type: string
          maxLength: 2000
          nullable: true

    OrganizationUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          nullable: true
        description:
          type: string
          maxLength: 2000
          nullable: true
        vision:
          type: string
          maxLength: 2000
          nullable: true
        mission:
          type: string
          maxLength: 2000
          nullable: true

    JoinOrganizationRequest:
      type: object
      required: [organization_code]
      properties:
        organization_code:
          type: string

    OrganizationMember:
      type: object
      required: [id, user_id, user_name, user_email, role, status]
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        user_name:
          type: string
        user_email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/MembershipStatus'
        organization_code:
          type: string
          nullable: true
        organization_name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true

    UserOrganizationStatus:
      type: object
      required: [membership_status]
      properties:
        organization:
          $ref: '#/components/schemas/Organization'
        membership_status:
          $ref: '#/components/schemas/MembershipStatus'
        pending_requests_count:
          type: integer
          default: 0

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    RegisterRequest:
      type: object
      required: [name, email, password, role]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        role:
          $ref: '#/components/schemas/Role'

    LoginResponse:
      type: object
      required: [access_token, refresh_token, token_type, user]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          default: bearer
        user:
          $ref: '#/components/schemas/User'

    Branding:
      type: object
      required: [business_name, primary_color, accent_color, background_color, currency, timezone, language]
      properties:
        business_name:
          type: string
        logo_url:
          type: string
          nullable: true
        primary_color:
          type: string
          description: Color hex, p. ej. #0B132B
        accent_color:
          type: string
          description: Color hex, p. ej. #00FF87
        background_color:
          type: string
        currency:
          type: string
          description: Código ISO 4217, p. ej. MXN
        timezone:
          type: string
          description: Zona IANA, p. ej. America/Mexico_City
        language:
          type: string
          description: Etiqueta BCP-47, p. ej. es-MX

    PrinterState:
      type: string
      enum: [idle, printing, paused, offline, error]

    SpoolRef:
      type: object
      required: [id, material, color]
      properties:
        id:
          type: integer
          format: int64
        material:
          type: string
        color:
          type: string
        grams_remaining:
          type: number
          format: float
          nullable: true

    OrderRef:
      type: object
      required: [id, folio, customer_name]
      properties:
        id:
          type: integer
          format: int64
        folio:
          type: string
        customer_name:
          type: string
        promised_date:
          type: string
          format: date
          nullable: true

    PrinterCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        model:
          type: string
          description: Modelo comercial de la impresora (p. ej. Prusa MK4)
          maxLength: 80
          nullable: true
        octoprint_url:
          type: string
          nullable: true
        api_key:
          type: string
          nullable: true
        bed_width:
          type: number
          format: float
          nullable: true
        bed_depth:
          type: number
          format: float
          nullable: true
        camera_available:
          type: boolean
          default: false
        cameras:
          type: array
          description: >-
            URLs de snapshot por cámara (BE-07). La primera es la principal.
            El backend las consume; jamás se exponen al cliente público.
          items:
            type: string
          nullable: true

    PrinterUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          nullable: true
        model:
          type: string
          maxLength: 80
          nullable: true
        octoprint_url:
          type: string
          nullable: true
        api_key:
          type: string
          nullable: true
        bed_width:
          type: number
          format: float
          nullable: true
        bed_depth:
          type: number
          format: float
          nullable: true
        camera_available:
          type: boolean
          nullable: true
        cameras:
          type: array
          description: URLs de snapshot por cámara (BE-07); reemplaza la lista.
          items:
            type: string
          nullable: true
        state:
          $ref: '#/components/schemas/PrinterState'
          nullable: true

    PrinterConnectionTestRequest:
      type: object
      required: [octoprint_url]
      description: 'BE-01: prueba de conexión antes del alta de la impresora.'
      properties:
        octoprint_url:
          type: string
          minLength: 1
          maxLength: 300
        api_key:
          type: string
          nullable: true

    PrinterConnectionTest:
      type: object
      required: [ok, message]
      properties:
        ok:
          type: boolean
        message:
          type: string
        version:
          type: string
          description: Versión del servidor OctoPrint si la conexión fue ok.
          nullable: true

    Printer:
      type: object
      required: [id, name, state]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        model:
          type: string
          nullable: true
        state:
          $ref: '#/components/schemas/PrinterState'
        progress:
          type: number
          format: float
          minimum: 0
          maximum: 100
          nullable: true
        remaining_seconds:
          type: integer
          nullable: true
        nozzle_temp:
          type: number
          format: float
          nullable: true
        nozzle_target:
          type: number
          format: float
          nullable: true
        bed_temp:
          type: number
          format: float
          nullable: true
        bed_target:
          type: number
          format: float
          nullable: true
        current_file:
          type: string
          nullable: true
        camera_available:
          type: boolean
          default: false
        cameras:
          type: array
          description: URLs de snapshot por cámara (solo admin; BE-08/BE-21).
          items:
            type: string
        loaded_spool:
          allOf:
            - $ref: '#/components/schemas/SpoolRef'
          nullable: true
        current_order:
          allOf:
            - $ref: '#/components/schemas/OrderRef'
          nullable: true
        last_seen:
          type: string
          format: date-time
          nullable: true

    QueueItemState:
      type: string
      enum: [pending, queued, printing, printed, failed]

    QueueItem:
      type: object
      required: [id, order_id, order_folio, product_name, quantity, printed_quantity, state]
      properties:
        id:
          type: integer
          format: int64
        order_id:
          type: integer
          format: int64
        order_folio:
          type: string
        product_name:
          type: string
        color:
          type: string
          nullable: true
        quantity:
          type: integer
        printed_quantity:
          type: integer
        missing_quantity:
          type: integer
        state:
          $ref: '#/components/schemas/QueueItemState'
        printer_id:
          type: integer
          format: int64
          nullable: true
          description: null = sin asignar
        position:
          type: integer
          description: Orden dentro de la columna
        estimated_minutes:
          type: integer
          nullable: true
        promised_date:
          type: string
          format: date
          nullable: true

    Queue:
      type: object
      required: [unassigned, by_printer, version]
      properties:
        unassigned:
          type: array
          items:
            $ref: '#/components/schemas/QueueItem'
        by_printer:
          type: object
          description: Mapa printer_id (string) -> items asignados
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/QueueItem'
        version:
          type: integer
          description: Versión para control de concurrencia optimista

    QueueReorderEntry:
      type: object
      required: [id, position]
      properties:
        id:
          type: integer
          format: int64
        printer_id:
          type: integer
          format: int64
          nullable: true
        position:
          type: integer

    QueueReorderRequest:
      type: object
      required: [version, items]
      properties:
        version:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/QueueReorderEntry'

    ItemState:
      type: string
      enum: [pending, queued, printing, printed, failed]

    OrderStatus:
      type: string
      enum: [confirmed, queued, printing, printed, packed, shipped, delivered, cancelled]

    DueState:
      type: string
      description: Derivado de la fecha prometida; alimenta las alertas visuales (P-07)
      enum: [none, ok, due_soon, overdue]

    CustomerCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        phone:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        notes:
          type: string
          nullable: true

    Customer:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        phone:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        notes:
          type: string
          nullable: true

    Product:
      type: object
      required: [id, name, base_price]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        material:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        estimated_weight_g:
          type: number
          format: float
          nullable: true
        estimated_minutes:
          type: integer
          nullable: true
        extra_cost:
          type: number
          format: float
          nullable: true
        has_gcode:
          type: boolean
          default: false
        base_price:
          type: number
          format: float

    OrderSummary:
      type: object
      required: [id, folio, customer_name, status, total, items_count, printed_count, due_state]
      properties:
        id:
          type: integer
          format: int64
        folio:
          type: string
        customer_name:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        promised_date:
          type: string
          format: date
          nullable: true
        due_state:
          $ref: '#/components/schemas/DueState'
        total:
          type: number
          format: float
        items_count:
          type: integer
        printed_count:
          type: integer
        created_at:
          type: string
          format: date-time

    OrderItem:
      type: object
      required: [id, product_id, product_name, quantity, printed_quantity, missing_quantity, state]
      properties:
        id:
          type: integer
          format: int64
        product_id:
          type: integer
          format: int64
        product_name:
          type: string
        color:
          type: string
          nullable: true
        quantity:
          type: integer
        printed_quantity:
          type: integer
        missing_quantity:
          type: integer
        state:
          $ref: '#/components/schemas/ItemState'
        printer_id:
          type: integer
          format: int64
          nullable: true
        printer_name:
          type: string
          nullable: true

    StatusHistoryEntry:
      type: object
      required: [status, occurred_at]
      properties:
        status:
          type: string
        previous_status:
          type: string
          nullable: true
        user_name:
          type: string
          nullable: true
        occurred_at:
          type: string
          format: date-time

    Shipment:
      type: object
      required: [carrier]
      properties:
        carrier:
          type: string
        tracking_number:
          type: string
          nullable: true
        tracking_url:
          type: string
          nullable: true
        shipped_at:
          type: string
          format: date
          nullable: true
        delivered_at:
          type: string
          format: date
          nullable: true

    OrderDetail:
      allOf:
        - $ref: '#/components/schemas/OrderSummary'
        - type: object
          required: [tracking_token, items, history]
          properties:
            tracking_token:
              type: string
            notes:
              type: string
              nullable: true
            customer:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/Customer'
            items:
              type: array
              items:
                $ref: '#/components/schemas/OrderItem'
            history:
              type: array
              items:
                $ref: '#/components/schemas/StatusHistoryEntry'
            shipment:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/Shipment'

    OrderItemInput:
      type: object
      required: [product_id, quantity]
      properties:
        product_id:
          type: integer
          format: int64
        color:
          type: string
          nullable: true
        quantity:
          type: integer
          minimum: 1

    OrderCreateRequest:
      type: object
      required: [items]
      properties:
        customer_id:
          type: integer
          format: int64
          nullable: true
        customer_name:
          type: string
          nullable: true
        customer_phone:
          type: string
          nullable: true
        promised_date:
          type: string
          format: date
          nullable: true
        notes:
          type: string
          nullable: true
        total:
          type: number
          format: float
          nullable: true
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItemInput'

    OrderStatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'

    SuggestionAssignment:
      type: object
      required: [item_id, printer_id, printer_name, explanation]
      properties:
        item_id:
          type: integer
          format: int64
        printer_id:
          type: integer
          format: int64
        printer_name:
          type: string
        explanation:
          type: string
        order_folio:
          type: string
          nullable: true
        product_name:
          type: string
          nullable: true
        estimated_minutes:
          type: integer
          nullable: true

    QueueSuggestion:
      type: object
      required: [version, assignments]
      properties:
        version:
          type: integer
        summary:
          type: string
          nullable: true
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/SuggestionAssignment'
        unassigned_item_ids:
          type: array
          items:
            type: integer
            format: int64

    QueueAcceptEntry:
      type: object
      required: [item_id, printer_id]
      properties:
        item_id:
          type: integer
          format: int64
        printer_id:
          type: integer
          format: int64

    QueueAcceptRequest:
      type: object
      required: [version, assignments]
      properties:
        version:
          type: integer
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/QueueAcceptEntry'

    PrintJob:
      type: object
      required: [id, item_id, printer_id, state]
      properties:
        id:
          type: integer
          format: int64
        item_id:
          type: integer
          format: int64
        printer_id:
          type: integer
          format: int64
        printer_name:
          type: string
          nullable: true
        state:
          $ref: '#/components/schemas/ItemState'
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        grams_real:
          type: number
          format: float
          nullable: true
        minutes_real:
          type: integer
          nullable: true
        failure_reason:
          type: string
          nullable: true
        current_file:
          type: string
          description: Nombre del archivo G-code asociado al job (si se subió)
          nullable: true

    PublicLookupRequest:
      type: object
      required: [folio, phone_last4]
      properties:
        folio:
          type: string
        phone_last4:
          type: string
          minLength: 4
          maxLength: 4
          pattern: '^[0-9]{4}$'

    PublicLookupResponse:
      type: object
      required: [tracking_token]
      properties:
        tracking_token:
          type: string

    PrintJobStartRequest:
      type: object
      required: [item_id, printer_id]
      properties:
        item_id:
          type: integer
          format: int64
        printer_id:
          type: integer
          format: int64

    PrintJobFailRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string

    StatusEvent:
      type: object
      required: [type, entity, entity_id, occurred_at]
      properties:
        type:
          type: string
          description: Tipo de evento, p. ej. printer.state, queue.updated, order.updated
        entity:
          type: string
        entity_id:
          type: integer
          format: int64
          nullable: true
        payload:
          type: object
          additionalProperties: true
        occurred_at:
          type: string
          format: date-time

security:
  - bearerAuth: []
