# NOVALAB — Contrato de API (stub temporal)
#
# ⚠️ TEMPORAL: este archivo es un SUBCONJUNTO mínimo escrito a mano para permitir
# el desarrollo contract-first de `apps/produccion` (P-01..P-03).
# Fuente de verdad definitiva: el OpenAPI GENERADO por el backend FastAPI
# (doc §3.1, §7). Cuando exista el backend, reemplazar este archivo por su
# `openapi.json`/`openapi.yaml` y regenerar el cliente Dart. No agregar aquí
# lógica de negocio ni endpoints fuera del alcance de la entrega.
openapi: 3.0.3
info:
  title: NOVALAB API
  description: >-
    Contrato compartido por las 3 aplicaciones. Esta es una versión parcial
    (auth, branding, impresoras y cola) usada mientras el backend no existe.
  version: 0.1.0
servers:
  - url: /
    description: Mismo origen (el backend se sirve detrás de Caddy en el puerto privado)

tags:
  - name: auth
  - name: public
  - name: printers
  - name: queue
  - name: print-jobs
  - name: orders
  - name: customers
  - name: products

paths:
  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Inicia sesión y devuelve tokens JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Renueva el access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token renovado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/public/branding:
    get:
      tags: [public]
      operationId: getBranding
      summary: Marca y configuración visible del negocio
      security: []
      responses:
        '200':
          description: Branding del negocio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branding'

  /api/printers:
    get:
      tags: [printers]
      operationId: listPrinters
      summary: Lista las impresoras con su estado en vivo
      responses:
        '200':
          description: Impresoras
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Printer'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/printers/{printerId}/camera/snapshot:
    get:
      tags: [printers]
      operationId: getPrinterCameraSnapshot
      summary: Última miniatura de cámara de la impresora (servida por el backend)
      description: >-
        Devuelve la última instantánea guardada por el backend (BE-07/08). El
        cliente nunca accede al stream ni a la IP de la impresora.
      parameters:
        - name: printerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Instantánea en PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: La impresora no tiene cámara o aún no hay snapshot

  /api/queue:
    get:
      tags: [queue]
      operationId: getQueue
      summary: Cola de producción (items sin asignar y por impresora)
      responses:
        '200':
          description: Cola completa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/queue/reorder:
    patch:
      tags: [queue]
      operationId: reorderQueue
      summary: Mueve y reordena items entre impresoras y la cola sin asignar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueReorderRequest'
      responses:
        '200':
          description: Cola actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Conflicto de versión de la cola; recargar

  /api/queue/suggest:
    post:
      tags: [queue]
      operationId: suggestQueueAssignment
      summary: Propone una asignación de la cola (BE-13, BE-14)
      description: >-
        El backend propone a qué impresora va cada item pendiente, con una
        explicación legible. El operador decide aceptar todo, aceptar parcial o
        descartar.
      responses:
        '200':
          description: Propuesta con explicación por item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueSuggestion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Conflicto de versión de la cola; recargar

  /api/queue/accept:
    post:
      tags: [queue]
      operationId: acceptQueueAssignment
      summary: Acepta (total o parcialmente) una propuesta de asignación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueAcceptRequest'
      responses:
        '200':
          description: Cola actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Conflicto de versión de la cola; recargar

  /api/print-jobs:
    post:
      tags: [print-jobs]
      operationId: startPrintJob
      summary: Confirma e inicia la impresión de un item (BE-05)
      description: >-
        Requiere confirmación explícita del operador ("cama libre y filamento
        correcto"). Nunca inicia impresiones de forma automática.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrintJobStartRequest'
      responses:
        '201':
          description: Job iniciado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: La impresora no está disponible

  /api/print-jobs/{jobId}/complete:
    post:
      tags: [print-jobs]
      operationId: completePrintJob
      summary: Marca un job como terminado
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Job no encontrado

  /api/print-jobs/{jobId}/fail:
    post:
      tags: [print-jobs]
      operationId: failPrintJob
      summary: Marca un job como fallido y registra el motivo
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrintJobFailRequest'
      responses:
        '200':
          description: Job actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Job no encontrado

  /api/print-jobs/{jobId}/reprint:
    post:
      tags: [print-jobs]
      operationId: reprintJob
      summary: Crea un nuevo job para reimprimir un item fallido
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '201':
          description: Nuevo job creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Job no encontrado

  /api/orders:
    get:
      tags: [orders]
      operationId: listOrders
      summary: Lista pedidos con filtros y búsqueda por folio/cliente
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: customer_id
          in: query
          schema:
            type: integer
            format: int64
        - name: due_before
          in: query
          schema:
            type: string
            format: date
        - name: q
          in: query
          description: Búsqueda por folio o nombre de cliente
          schema:
            type: string
      responses:
        '200':
          description: Pedidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [orders]
      operationId: createOrder
      summary: Crea un pedido nuevo (P-09)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '201':
          description: Pedido creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Datos inválidos

  /api/orders/{orderId}:
    get:
      tags: [orders]
      operationId: getOrder
      summary: Detalle de pedido (items, faltantes, historial, envío)
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Pedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Pedido no encontrado

  /api/orders/{orderId}/status:
    patch:
      tags: [orders]
      operationId: updateOrderStatus
      summary: Cambio manual de estado (Empacado, Enviado, Entregado, Cancelado)
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdateRequest'
      responses:
        '200':
          description: Pedido actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Pedido no encontrado

  /api/customers:
    get:
      tags: [customers]
      operationId: listCustomers
      summary: Lista de clientes (para nuevo pedido)
      responses:
        '200':
          description: Clientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/products:
    get:
      tags: [products]
      operationId: listProducts
      summary: Catálogo de productos (para nuevo pedido)
      responses:
        '200':
          description: Productos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'

# Canal de tiempo real (WebSocket). OpenAPI no describe WebSocket de forma nativa;
# se documenta mediante extensión para los generadores de clientes.
x-websocket:
  path: /ws
  description: >-
    Eventos en tiempo real (estado de impresoras, cola y pedidos). Cada mensaje
    es un objeto StatusEvent serializado como JSON.
  message:
    $ref: '#/components/schemas/StatusEvent'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: No autenticado o token inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Demasiados intentos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    Role:
      type: string
      enum: [owner, operator]

    User:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    LoginResponse:
      type: object
      required: [access_token, refresh_token, token_type, user]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          default: bearer
        user:
          $ref: '#/components/schemas/User'

    Branding:
      type: object
      required: [business_name, primary_color, accent_color, background_color, currency, timezone, language]
      properties:
        business_name:
          type: string
        logo_url:
          type: string
          nullable: true
        primary_color:
          type: string
          description: Color hex, p. ej. #0B132B
        accent_color:
          type: string
          description: Color hex, p. ej. #00FF87
        background_color:
          type: string
        currency:
          type: string
          description: Código ISO 4217, p. ej. MXN
        timezone:
          type: string
          description: Zona IANA, p. ej. America/Mexico_City
        language:
          type: string
          description: Etiqueta BCP-47, p. ej. es-MX

    PrinterState:
      type: string
      enum: [idle, printing, paused, offline, error]

    SpoolRef:
      type: object
      required: [id, material, color]
      properties:
        id:
          type: integer
          format: int64
        material:
          type: string
        color:
          type: string
        grams_remaining:
          type: number
          format: float
          nullable: true

    OrderRef:
      type: object
      required: [id, folio, customer_name]
      properties:
        id:
          type: integer
          format: int64
        folio:
          type: string
        customer_name:
          type: string
        promised_date:
          type: string
          format: date
          nullable: true

    Printer:
      type: object
      required: [id, name, state]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        state:
          $ref: '#/components/schemas/PrinterState'
        progress:
          type: number
          format: float
          minimum: 0
          maximum: 100
          nullable: true
        remaining_seconds:
          type: integer
          nullable: true
        nozzle_temp:
          type: number
          format: float
          nullable: true
        nozzle_target:
          type: number
          format: float
          nullable: true
        bed_temp:
          type: number
          format: float
          nullable: true
        bed_target:
          type: number
          format: float
          nullable: true
        current_file:
          type: string
          nullable: true
        camera_available:
          type: boolean
          default: false
        loaded_spool:
          allOf:
            - $ref: '#/components/schemas/SpoolRef'
          nullable: true
        current_order:
          allOf:
            - $ref: '#/components/schemas/OrderRef'
          nullable: true
        last_seen:
          type: string
          format: date-time
          nullable: true

    QueueItemState:
      type: string
      enum: [pending, queued, printing, printed, failed]

    QueueItem:
      type: object
      required: [id, order_id, order_folio, product_name, quantity, printed_quantity, state]
      properties:
        id:
          type: integer
          format: int64
        order_id:
          type: integer
          format: int64
        order_folio:
          type: string
        product_name:
          type: string
        color:
          type: string
          nullable: true
        quantity:
          type: integer
        printed_quantity:
          type: integer
        missing_quantity:
          type: integer
        state:
          $ref: '#/components/schemas/QueueItemState'
        printer_id:
          type: integer
          format: int64
          nullable: true
          description: null = sin asignar
        position:
          type: integer
          description: Orden dentro de la columna
        estimated_minutes:
          type: integer
          nullable: true
        promised_date:
          type: string
          format: date
          nullable: true

    Queue:
      type: object
      required: [unassigned, by_printer, version]
      properties:
        unassigned:
          type: array
          items:
            $ref: '#/components/schemas/QueueItem'
        by_printer:
          type: object
          description: Mapa printer_id (string) -> items asignados
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/QueueItem'
        version:
          type: integer
          description: Versión para control de concurrencia optimista

    QueueReorderEntry:
      type: object
      required: [id, position]
      properties:
        id:
          type: integer
          format: int64
        printer_id:
          type: integer
          format: int64
          nullable: true
        position:
          type: integer

    QueueReorderRequest:
      type: object
      required: [version, items]
      properties:
        version:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/QueueReorderEntry'

    ItemState:
      type: string
      enum: [pending, queued, printing, printed, failed]

    OrderStatus:
      type: string
      enum: [confirmed, queued, printing, printed, packed, shipped, delivered, cancelled]

    DueState:
      type: string
      description: Derivado de la fecha prometida; alimenta las alertas visuales (P-07)
      enum: [none, ok, due_soon, overdue]

    Customer:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        phone:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        notes:
          type: string
          nullable: true

    Product:
      type: object
      required: [id, name, base_price]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        material:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        estimated_weight_g:
          type: number
          format: float
          nullable: true
        estimated_minutes:
          type: integer
          nullable: true
        extra_cost:
          type: number
          format: float
          nullable: true
        has_gcode:
          type: boolean
          default: false
        base_price:
          type: number
          format: float

    OrderSummary:
      type: object
      required: [id, folio, customer_name, status, total, items_count, printed_count, due_state]
      properties:
        id:
          type: integer
          format: int64
        folio:
          type: string
        customer_name:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        promised_date:
          type: string
          format: date
          nullable: true
        due_state:
          $ref: '#/components/schemas/DueState'
        total:
          type: number
          format: float
        items_count:
          type: integer
        printed_count:
          type: integer
        created_at:
          type: string
          format: date-time

    OrderItem:
      type: object
      required: [id, product_id, product_name, quantity, printed_quantity, missing_quantity, state]
      properties:
        id:
          type: integer
          format: int64
        product_id:
          type: integer
          format: int64
        product_name:
          type: string
        color:
          type: string
          nullable: true
        quantity:
          type: integer
        printed_quantity:
          type: integer
        missing_quantity:
          type: integer
        state:
          $ref: '#/components/schemas/ItemState'
        printer_id:
          type: integer
          format: int64
          nullable: true
        printer_name:
          type: string
          nullable: true

    StatusHistoryEntry:
      type: object
      required: [status, occurred_at]
      properties:
        status:
          type: string
        previous_status:
          type: string
          nullable: true
        user_name:
          type: string
          nullable: true
        occurred_at:
          type: string
          format: date-time

    Shipment:
      type: object
      required: [carrier]
      properties:
        carrier:
          type: string
        tracking_number:
          type: string
          nullable: true
        tracking_url:
          type: string
          nullable: true
        shipped_at:
          type: string
          format: date
          nullable: true
        delivered_at:
          type: string
          format: date
          nullable: true

    OrderDetail:
      allOf:
        - $ref: '#/components/schemas/OrderSummary'
        - type: object
          required: [tracking_token, items, history]
          properties:
            tracking_token:
              type: string
            notes:
              type: string
              nullable: true
            customer:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/Customer'
            items:
              type: array
              items:
                $ref: '#/components/schemas/OrderItem'
            history:
              type: array
              items:
                $ref: '#/components/schemas/StatusHistoryEntry'
            shipment:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/Shipment'

    OrderItemInput:
      type: object
      required: [product_id, quantity]
      properties:
        product_id:
          type: integer
          format: int64
        color:
          type: string
          nullable: true
        quantity:
          type: integer
          minimum: 1

    OrderCreateRequest:
      type: object
      required: [items]
      properties:
        customer_id:
          type: integer
          format: int64
          nullable: true
        customer_name:
          type: string
          nullable: true
        customer_phone:
          type: string
          nullable: true
        promised_date:
          type: string
          format: date
          nullable: true
        notes:
          type: string
          nullable: true
        total:
          type: number
          format: float
          nullable: true
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItemInput'

    OrderStatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'

    SuggestionAssignment:
      type: object
      required: [item_id, printer_id, printer_name, explanation]
      properties:
        item_id:
          type: integer
          format: int64
        printer_id:
          type: integer
          format: int64
        printer_name:
          type: string
        explanation:
          type: string
        order_folio:
          type: string
          nullable: true
        product_name:
          type: string
          nullable: true
        estimated_minutes:
          type: integer
          nullable: true

    QueueSuggestion:
      type: object
      required: [version, assignments]
      properties:
        version:
          type: integer
        summary:
          type: string
          nullable: true
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/SuggestionAssignment'
        unassigned_item_ids:
          type: array
          items:
            type: integer
            format: int64

    QueueAcceptEntry:
      type: object
      required: [item_id, printer_id]
      properties:
        item_id:
          type: integer
          format: int64
        printer_id:
          type: integer
          format: int64

    QueueAcceptRequest:
      type: object
      required: [version, assignments]
      properties:
        version:
          type: integer
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/QueueAcceptEntry'

    PrintJob:
      type: object
      required: [id, item_id, printer_id, state]
      properties:
        id:
          type: integer
          format: int64
        item_id:
          type: integer
          format: int64
        printer_id:
          type: integer
          format: int64
        printer_name:
          type: string
          nullable: true
        state:
          $ref: '#/components/schemas/ItemState'
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        grams_real:
          type: number
          format: float
          nullable: true
        minutes_real:
          type: integer
          nullable: true
        failure_reason:
          type: string
          nullable: true

    PrintJobStartRequest:
      type: object
      required: [item_id, printer_id]
      properties:
        item_id:
          type: integer
          format: int64
        printer_id:
          type: integer
          format: int64

    PrintJobFailRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string

    StatusEvent:
      type: object
      required: [type, entity, entity_id, occurred_at]
      properties:
        type:
          type: string
          description: Tipo de evento, p. ej. printer.state, queue.updated, order.updated
        entity:
          type: string
        entity_id:
          type: integer
          format: int64
          nullable: true
        payload:
          type: object
          additionalProperties: true
        occurred_at:
          type: string
          format: date-time

security:
  - bearerAuth: []
