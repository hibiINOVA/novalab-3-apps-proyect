name: produccion
description: "NOVALAB — App 1 Producción (panel de operación de impresión 3D)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Estado
  flutter_riverpod: ^3.4.3
  # Navegación
  go_router: ^17.5.0
  # HTTP (cliente OpenAPI usa dio)
  dio: ^5.11.1
  # Tiempo real (/ws)
  web_socket_channel: ^3.0.3
  # Persistencia de sesión (P-01)
  shared_preferences: ^2.5.6
  # Formato es-MX
  intl: ^0.20.2
  # Colecciones inmutables usadas por el cliente generado (BuiltList/BuiltMap)
  built_collection: ^5.1.1
  # Contrato OpenAPI (anotación consumida por openapi_generator)
  openapi_generator_annotations: ^7.0.0
  # Cliente Dart/dio generado desde packages/api-contract/openapi.yaml
  novalab_api:
    path: ../packages/api_client

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Generación del cliente desde packages/api-contract/openapi.yaml
  build_runner: ^2.15.1
  openapi_generator: ^7.0.0
  # Simulación de respuestas HTTP en pruebas y en modo mock
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true

